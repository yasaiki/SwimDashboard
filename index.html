<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swim Progress — Swimmers</title><link rel="stylesheet" href="css/styles.css"></head><body><main class="shell">
<div class="topbar"><div class="brand">🏊 Swim Progress</div><div class="muted">Swimmer directory</div></div>
<section class="card"><div class="hero"><div><h1>Swimmers</h1><div class="muted">Choose a swimmer to open their progress dashboard.</div></div><div id="syncInfo" class="muted"></div></div></section>
<section class="card"><div class="toolbar"><div class="field"><label for="searchInput">Search</label><input id="searchInput" class="search" placeholder="Search by swimmer name"></div><div class="field"><label for="genderFilter">Gender</label><select id="genderFilter"><option value="All">All</option><option value="F">Girls</option><option value="M">Boys</option></select></div><div class="field"><label for="statusFilter">Status</label><select id="statusFilter"><option value="active">Active</option><option value="All">All</option></select></div></div></section>
<section id="swimmerGrid" class="swimmer-grid"></section><div id="emptyState" class="card empty hide">No swimmers match those filters.</div><div class="footer-note">Data is loaded from <code>data/swimmers.json</code>; adding swimmers no longer requires editing this HTML.</div>
</main><script type="module" src="js/landing.js"></script></body></html>
